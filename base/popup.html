<!DOCTYPE html>
<!--
  CLEANING NOTE (2026-10-01): Removed the "Clear All Cookies" (#clearBtn) button.
  Independent audit verified it triggered chrome.browsingData.remove({"since":0},{"cookies":true}),
  wiping ALL browser cookies — not just this extension's data. The button and its
  dedicated styling were removed; its JS handler is being removed from popup.js by a
  separate worker. All other popup content (login link, styles, layout) is unchanged.
-->
<html>
  <head>
    <meta charset="UTF-8">
    <style>
      *{
        margin: 0;
        padding: 0;
      }
      body{
        background: white;
      }
      .container{
        width: 400px;
      }
      .title{
        padding: 10px 20px 5px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .title .icon{
        display: none !important;
        width: 24px;
        height: 24px;
      }
      .title .title-text{
        margin-left: 10px;
        font-size: 12px;
        text-align: center;
      }
      .author{
        display: none !important; 
        margin-bottom: 10px;
        font-size: 12px;
        text-align: center;
      }
      .menu-list .menu-item{
        padding: 10px 20px;
        font-size: 24px;
        text-align: center;
        border-top: 0px solid #ddd;
        cursor: pointer;
      }
      .menu-list .menu-item:hover{
        background: #fff;
      }
      .hidden{
        display: none !important;
      }
      .copy_success{
        position: fixed;
        display: flex;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        align-items: center;
        justify-content: center;
      }
      .copy_success .text{
        font-size: 14px;
        color: black;
        text-align: center;
      }
      .introduction{
        border-top: 1px solid #ddd;
        padding: 10px 20px;
        font-size: 12px;
      }
      .introduction .warn{
        color: #f50000;
        font-style: normal;
      }
      .border {
        border: 3px solid #f7941e;
        border-radius: 5px;
      }
      .container.border {
        margin: auto;
      }
    </style>
  </head>
  <body>
    <textarea id="clipboard" class="hidden"></textarea>
    <div class="container border">
      
      <div class="title">
        <img class="icon" src="/icons/icon128.png" />
        <div class="title-text">
          <img style="height: 100%; width: 80%;" src="/icons/icon128.png">
          <br><strong></strong>
        </div>
      </div>
      
      <center>
        <div style="font-weight: bold;">
          <a href="https://app.creatortools.pro/member" target="_blank">Login to Account?</a>
          <br><br> 
          <div style="font-weight: bold; padding: 0px 25px 15px 25px; font-family: sans-serif;">
            Hi, Thanks for using our service!
          </div>
        </div>
      </center>
 
      <div id="copy_success" class="copy_success hidden" style="display: none;">
        <div class="text">Thanks For Using</div>
      </div>
    </div>
  
    <script src="popup.js"></script>
  </body>
</html>
